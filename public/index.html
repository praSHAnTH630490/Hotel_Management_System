<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurelia — Hotel Front Desk Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-name">Aurelia</div>
          <div class="brand-sub">Front Desk Console</div>
        </div>
      </div>

      <nav class="nav-group" id="nav-group">
        <div class="nav-label">Operations</div>
        <button class="nav-link" data-route="dashboard"><span class="nav-icon">&#9670;</span> Dashboard</button>
        <button class="nav-link" data-route="reservations"><span class="nav-icon">&#128197;</span> Reservations</button>
        <button class="nav-link" data-route="rooms"><span class="nav-icon">&#128273;</span> Rooms</button>
        <button class="nav-link" data-route="customers"><span class="nav-icon">&#128100;</span> Guests</button>

        <div class="nav-label">Revenue</div>
        <button class="nav-link" data-route="payments"><span class="nav-icon">&#128179;</span> Payments</button>
        <button class="nav-link" data-route="cancellations"><span class="nav-icon">&#10005;</span> Cancellations</button>

        <div class="nav-label">Guest Experience</div>
        <button class="nav-link" data-route="room-services"><span class="nav-icon">&#128276;</span> Room Service</button>
        <button class="nav-link" data-route="feedback"><span class="nav-icon">&#9733;</span> Feedback</button>

        <div class="nav-label">Property</div>
        <button class="nav-link" data-route="room-types"><span class="nav-icon">&#127976;</span> Room Types</button>
        <button class="nav-link" data-route="amenities"><span class="nav-icon">&#10022;</span> Amenities</button>
        <button class="nav-link" data-route="staff"><span class="nav-icon">&#128188;</span> Staff</button>
      </nav>

      <div class="sidebar-footer">
        Aurelia Hotel<br />
        Reservation &amp; Front Desk System
      </div>
    </aside>

    <main class="main" id="main">
      <!-- views render here -->
    </main>
  </div>

  <div class="toast-stack" id="toast-stack"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
